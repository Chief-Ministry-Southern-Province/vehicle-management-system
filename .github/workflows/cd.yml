name: VMS Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: vms-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to AWS EC2
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # -------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Configure SSH
      # -------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          echo "Configuring SSH..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/vms_deploy_key"
          chmod 600 "$HOME/.ssh/vms_deploy_key"

          ssh-keyscan \
            -p "$SERVER_PORT" \
            -H "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # -------------------------------------------------------
      # 3. Test SSH authentication
      # -------------------------------------------------------
      - name: Test SSH Connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          echo "Testing SSH connection..."

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/vms_deploy_key" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH authentication successful.'"

      # -------------------------------------------------------
      # 4. Deploy Laravel backend
      # -------------------------------------------------------
      - name: Deploy Laravel Backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/vms_deploy_key" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" <<'EOF'

          set -euo pipefail

          PROJECT_DIR="/var/www/vehicle-management-system"
          BACKEND_DIR="$PROJECT_DIR/backend"

          echo "========================================"
          echo " VMS Production Deployment"
          echo "========================================"

          echo ""
          echo "1. Opening project directory..."

          cd "$PROJECT_DIR"

          echo ""
          echo "2. Pulling latest source code..."

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo ""
          echo "3. Opening Laravel backend..."

          cd "$BACKEND_DIR"

          echo ""
          echo "4. Installing production dependencies..."

          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

          echo ""
          echo "5. Enabling maintenance mode..."

          php artisan down --retry=60 || true

          # Make sure Laravel comes back online even if a later
          # deployment command fails.
          cleanup() {
            echo ""
            echo "Restoring application availability..."
            php artisan up || true
          }

          trap cleanup EXIT

          echo ""
          echo "6. Clearing old Laravel caches..."

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          echo ""
          echo "7. Running database migrations..."

          php artisan migrate --force

          echo ""
          echo "8. Optimizing Laravel..."

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo ""
          echo "9. Restarting queue workers..."

          php artisan queue:restart || true

          echo ""
          echo "10. Disabling maintenance mode..."

          php artisan up

          trap - EXIT

          echo ""
          echo "========================================"
          echo " Deployment completed successfully"
          echo "========================================"

          EOF