name: VMS Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy:
    name: Deploy VMS
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/vms_deploy_key
          chmod 600 ~/.ssh/vms_deploy_key

          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/vms_deploy_key \
            -o IdentitiesOnly=yes \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

            set -e

            cd /var/www/vms

            echo "Pulling latest code..."
            git fetch origin
            git checkout main
            git pull origin main

            echo "Installing backend dependencies..."
            cd backend
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Optimizing Laravel..."
            php artisan optimize

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deployment completed successfully."

          EOF