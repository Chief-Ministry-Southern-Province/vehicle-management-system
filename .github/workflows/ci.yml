name: Vehicle Management CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  # FRONTEND CI

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter and StyleLint
        run: npm run lint

      - name: Build React Application
        run: npm run build


  # BACKEND CI

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Check PHP Version
        run: php -v

      - name: Install Composer Dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Create CI Environment File
        run: cp .env.example .env

      - name: Generate CI Application Key
        run: php artisan key:generate

      - name: Check Laravel Version
        run: php artisan --version

      - name: Run Laravel Tests
        run: php artisan test


  # BACKEND CD - AWS EC2
  
  deploy:
    name: Deploy Backend to AWS

    # Both CI jobs MUST succeed before deployment can start.
    needs:
      - frontend
      - backend

    # Deploy only for an actual push/merge to main.
    # Pull requests and develop pushes will never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    concurrency:
      group: vms-production-backend
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/vms_deploy_key
          chmod 600 ~/.ssh/vms_deploy_key

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy Laravel Backend to AWS EC2
        run: |
          ssh \
            -i ~/.ssh/vms_deploy_key \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

            set -e

            APP_DIR="/var/www/vehicle-management-system/backend"

            echo "=========================================="
            echo " VMS-GOV Backend Production Deployment"
            echo "=========================================="

            cd "$APP_DIR"

            echo "Current production commit:"
            git rev-parse --short HEAD

            echo "Fetching latest main branch..."
            git fetch origin main

            echo "Switching to main branch..."
            git checkout main

            echo "Pulling latest production code..."
            git pull --ff-only origin main

            echo "Installing production Composer dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction \
              --no-progress

            echo "Enabling Laravel maintenance mode..."
            php artisan down --retry=60 || true

            cleanup() {
              echo "Ensuring application leaves maintenance mode..."
              php artisan up || true
            }

            trap cleanup EXIT

            echo "Running production database migrations..."
            php artisan migrate --force

            echo "Clearing old Laravel caches..."
            php artisan optimize:clear

            echo "Building Laravel production caches..."
            php artisan optimize

            echo "Restarting Laravel queue workers..."
            php artisan queue:restart

            echo "Disabling Laravel maintenance mode..."
            php artisan up

            trap - EXIT

            echo "Production deployment commit:"
            git rev-parse --short HEAD

            echo "=========================================="
            echo " VMS-GOV Deployment Completed Successfully"
            echo "=========================================="

          EOF